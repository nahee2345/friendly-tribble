name: QA PR29 independent P0 gate, ledger, crash
on:
  push:
    branches:
      - qa/stage2-pr29-independent-e2e-20261106
  workflow_dispatch:
jobs:
  qa-pr29-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project and test requirements
        run: python -m pip install -e '.[web]' pytest
      - name: QA-owned independent 20pct, approval, replay, multiprocess and SIGKILL
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -vv -rA tests/test_qa_pr29_independent_atomic.py
      - name: Independently rerun authenticated HTTP unverified release gates
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -vv -rA tests/test_qa_p0_api_ledger.py -k 'http_order_refuses_unverified_opening_nav_without_any_order or authenticated_paper_readiness_endpoint_is_unverified'
      - name: Cross-check original technical PR29 contracts separately
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q tests/test_stage2_verified_opening_nav_and_atomic_paper.py
