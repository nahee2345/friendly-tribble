name: PreKIS bounded 2026 NYSE calendar and P0 session regression
on:
  push:
    branches: [tech/qa24-nyse-session-calendar-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-calendar-and-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Python test requirements
        run: python -m pip install -e '.[web]' pytest
      - name: Official 2026 calendar, turnover contract and API controls
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q \
            tests/test_stage1_us_market_calendar.py \
            tests/test_p0_session_reservations.py \
            tests/test_p0_turnover.py \
            tests/test_qa_p0_api_ledger.py \
            tests/test_stage1_controls_cards.py
      - name: Backup and restart
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q tests/test_stage1_backup.py \
            tests/test_stage1_schema_migration.py tests/test_web_local_backup.py \
            tests/test_stage1_paper.py::test_funding_restart_no_duplicate
