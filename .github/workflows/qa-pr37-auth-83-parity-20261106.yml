name: QA PR37 independent auth and PR34 83-node parity
on:
  push:
    branches: [qa/pr37-auth-race-regression-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-auth-and-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix web/frontend ci
      - name: QA-owned current vs stale 200/401/403 timing checks
        run: npm --prefix web/frontend test -- src/qaPr37AuthRace.test.ts
      - name: Re-run PR37 tech auth contracts separately
        run: npm --prefix web/frontend test -- src/authRace.test.ts src/apiAuthIsolation.test.ts src/ManualAssetsPanel.qa016.test.tsx
      - name: Production build unchanged
        run: npm --prefix web/frontend run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[web]' pytest
      - name: P0 no-order, owner-control, verified-writer and integrity guards
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q tests/test_stage2_integrity_diagnostic_priority.py tests/test_stage2_verified_opening_nav_and_atomic_paper.py tests/test_stage2_http_current_readiness.py tests/test_tech_replay_qa30_stop.py
  historical-83-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "pr34-oct19", sha: "9e0bd8322152b00fdabe6212df39c7c65997a10c", utc: "2026-10-19T10:00:00Z"}
          - {name: "pr34-nov06", sha: "9e0bd8322152b00fdabe6212df39c7c65997a10c", utc: "2026-11-06T10:00:00Z"}
          - {name: "pr37-oct19", sha: "75a9b8e96bc7b8cae8306e8c904da441a9a7fa9d", utc: "2026-10-19T10:00:00Z"}
          - {name: "pr37-nov06", sha: "75a9b8e96bc7b8cae8306e8c904da441a9a7fa9d", utc: "2026-11-06T10:00:00Z"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[web]' pytest freezegun
      - name: Collect versions and commit identifiers
        run: |
          mkdir -p triage
          python -m pip freeze > triage/pip-freeze.txt
          git rev-parse HEAD > triage/ref.txt
          python -c 'import sys,sqlite3; print(sys.version,sqlite3.sqlite_version)' > triage/environment.txt
      - name: Fixed clock external plugin (no app gate override)
        run: |
          cat >/tmp/qa_pr37_fixed_clock.py <<'PY'
          import os
          from freezegun import freeze_time
          clock=None
          def pytest_configure(config):
              global clock
              clock=freeze_time(os.environ["QA_FIXED_CLOCK"],auto_tick_seconds=0.001)
              clock.start()
          def pytest_unconfigure(config):
              if clock: clock.stop()
          PY
      - name: Run unchanged 83 historical node IDs; keep failed result
        env:
          PYTHONPATH: /tmp
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          QA_FIXED_CLOCK: ${{ matrix.utc }}
        run: |
          set +e
          python -m pytest -p qa_pr37_fixed_clock -q --tb=line --junitxml=triage/results.xml tests/test_stage4_portfolio.py tests/test_stage5_accounting.py tests/test_stage6_risk.py tests/test_stage7_release.py
          code=$?
          set -e
          python - <<'PY'
          import xml.etree.ElementTree as ET,json
          root=ET.parse("triage/results.xml").getroot()
          rows=[]
          for x in root.iter("testcase"):
              failed=x.find("failure")
              if failed is None: failed=x.find("error")
              rows.append({"id":x.attrib.get("classname","")+"::"+x.attrib.get("name",""),"result":"FAIL" if failed is not None else "PASS","first_error":failed.attrib.get("message","")[:250] if failed is not None else ""})
          print(json.dumps({"total":len(rows),"fail":sum(r["result"]=="FAIL" for r in rows)},ensure_ascii=False))
          open("triage/nodes.json","w").write(json.dumps(rows,ensure_ascii=False,indent=2))
          assert len(rows)==83
          PY
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-83-${{ matrix.name }}
          path: triage/
          retention-days: 14
