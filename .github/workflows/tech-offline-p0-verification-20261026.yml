name: Wealthy pre-KIS offline verification candidate
on:
  push:
    branches: [tech/offline-p0-verification-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-integrity-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install test requirements
        run: |
          python -m pip install -e '.[web]' pytest
          npm --prefix web/frontend ci
      - name: Independent-temp SQLite API, ownership, news and P0 policy
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q \
            tests/test_qa_p0_api_ledger.py \
            tests/test_qa001_003_manual_scope.py \
            tests/test_qa016_news_freshness.py \
            tests/test_qa002_last_good_news.py \
            tests/test_p0_ui_click_contract.py \
            tests/test_stage1_controls_cards.py \
            tests/test_p0_turnover.py
      - name: React retry, tab loss, unknown results and cross-tab tests
        run: npm --prefix web/frontend run test -- src/ManualAssetsPanel.qa016.test.tsx
      - name: TypeScript compile and Vite build
        run: npm --prefix web/frontend run build
      - name: Independent backup and restart
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q tests/test_stage1_backup.py \
            tests/test_stage1_schema_migration.py \
            tests/test_web_local_backup.py \
            tests/test_stage1_paper.py::test_funding_restart_no_duplicate \
            tests/test_stage1_paper.py::test_account_eligibility
      - name: Dependency exposure analysis (no automatic force changes)
        run: |
          npm --prefix web/frontend ls undici jsdom || true
          npm --prefix web/frontend audit --omit=dev --audit-level=high || true
          npm --prefix web/frontend audit --audit-level=high || true
  legacy-acceptance-blocker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install legacy dependencies
        run: python -m pip install -e '.[web]' pytest
      - name: All unchanged Stage 7 and 10 regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: bash scripts/stage7_acceptance.sh
