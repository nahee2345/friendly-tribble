name: Stage2 P0 PAPER fail-closed guards (isolated)
on:
  push:
    branches: [tech/stage2-paper-safety-guards-20261104]
  pull_request:
    branches: [tech/stage1-integration-audit-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0-sqlite-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Python deps
        run: python -m pip install -e '.[web]' pytest
      - name: P0 default stop and unverified-session release barrier
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q \
            tests/test_p0_explicit_paper_control.py \
            tests/test_p0_unverified_paper_release.py \
            tests/test_p0_session_reservations.py \
            tests/test_stage1_controls_cards.py \
            tests/test_stage1_us_market_calendar.py \
            tests/test_qa_p0_api_ledger.py::test_http_order_refuses_unverified_opening_nav_without_any_order
  frontend-null-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm --prefix web/frontend ci
      - run: npm --prefix web/frontend run test -- src/paperControlDisplay.test.ts
      - run: npm --prefix web/frontend run build
  audit-runtime-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web/frontend ci
      - name: Runtime dependency audit (scope separated from dev-only)
        run: npm --prefix web/frontend audit --omit=dev --audit-level=high
      - name: Record undici dependency source
        run: npm --prefix web/frontend ls undici --all || true
