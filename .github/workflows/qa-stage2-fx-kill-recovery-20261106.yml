name: QA Stage2 FX/order SIGKILL backup and owner isolation
on:
  push:
    branches: [qa/stage2-fx-kill-backup-owner-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-independent-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local-only test dependencies
        run: python -m pip install -e '.[web]' pytest
      - name: QA-owned SIGKILL/backup/retry/owner tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -vv -rA tests/test_qa_stage2_fx_kill_backup_owner.py
      - name: Existing HTTP authentication and no-write safety
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q tests/test_stage2_http_current_readiness.py tests/test_qa_p0_api_ledger.py -k 'authenticated_http_order_and_opening_nav_fail_closed_without_evidence or http_order_refuses_unverified_opening_nav_without_any_order or authenticated_paper_readiness_endpoint_is_unverified'
