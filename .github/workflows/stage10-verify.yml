name: Wealthy Stage10 Ubuntu Verification
on:
  push:
    branches: [stage10-offline-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  stage10:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[web]' pytest
          npm --prefix web/frontend ci
      - name: Offline security, accounting and frontend regression
        run: bash scripts/stage10_acceptance.sh
