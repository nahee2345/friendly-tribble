name: Wealthy QA001-003 Candidate Verification
on:
  push:
    branches: [tech/qa001-003-isolated-20261025]
  pull_request:
    branches: [stage10-offline-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    name: Isolated QA001-003 and UI build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install test dependencies
        run: |
          python -m pip install -e '.[web]' pytest
          npm --prefix web/frontend ci
      - name: QA isolated backend regression
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q tests/test_qa001_003_manual_scope.py tests/test_qa002_last_good_news.py tests/test_stage10_news_manual_assets.py tests/test_stage10_dashboard_fallback.py tests/test_stage10_news_evidence.py tests/test_stage1_controls_cards.py tests/test_p0_turnover.py
      - name: Frontend TypeScript and bundle
        run: npm --prefix web/frontend run build
      - name: Isolated backups, restore, schema migration and PAPER restart
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q tests/test_stage1_backup.py tests/test_stage1_schema_migration.py tests/test_web_local_backup.py tests/test_stage1_paper.py
  preexisting:
    name: Baseline Stage10 regression (existing failures remain blockers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[web]' pytest
      - name: Full legacy baseline tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: bash scripts/stage7_acceptance.sh
