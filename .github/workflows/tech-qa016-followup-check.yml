name: Wealthy QA016 Followup Candidate
on:
  push:
    branches: [tech/qa016-followup-isolated-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install isolated CI requirements
        run: |
          python -m pip install -e '.[web]' pytest
          npm --prefix web/frontend ci
      - name: QA016 backend / owner / retry / approval regression
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q \
            tests/test_qa016_news_freshness.py \
            tests/test_qa002_last_good_news.py \
            tests/test_qa001_003_manual_scope.py \
            tests/test_stage10_news_manual_assets.py \
            tests/test_stage10_dashboard_fallback.py \
            tests/test_stage10_news_evidence.py \
            tests/test_p0_ui_click_contract.py \
            tests/test_stage1_controls_cards.py \
            tests/test_p0_turnover.py
      - name: Manual asset lost-response and double-click React UI tests
        run: npm --prefix web/frontend run test -- src/ManualAssetsPanel.qa016.test.tsx
      - name: TypeScript and frontend bundle
        run: npm --prefix web/frontend run build
      - name: Isolated data backup and restart
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q tests/test_stage1_backup.py \
            tests/test_stage1_schema_migration.py \
            tests/test_web_local_backup.py \
            tests/test_stage1_paper.py::test_funding_restart_no_duplicate \
            tests/test_stage1_paper.py::test_account_eligibility
  existing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: python -m pip install -e '.[web]' pytest
      - name: Full existing Stage7/Stage10 suite - do not waive failures
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: bash scripts/stage7_acceptance.sh
