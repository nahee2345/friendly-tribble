name: Stage2 verified NAV and unified 20pct PAPER atomicity
on:
  push:
    branches: [tech/stage2-nav-turnover-integration-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nav-and-unified-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Python test dependencies
        run: python -m pip install -e '.[web]' pytest
      - name: Syntax compile (modules and fixtures)
        run: python -m compileall -q wealthy_server tests/test_stage2_verified_opening_nav_and_atomic_paper.py
      - name: Opening NAV, source hashes, atomic reservations and rollback
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q \
            tests/test_stage2_verified_opening_nav_and_atomic_paper.py \
            tests/test_p0_explicit_paper_control.py \
            tests/test_p0_unverified_paper_release.py \
            tests/test_p0_session_reservations.py \
            tests/test_stage1_us_market_calendar.py \
            tests/test_qa_p0_api_ledger.py::test_http_order_refuses_unverified_opening_nav_without_any_order \
            tests/test_qa_p0_api_ledger.py::test_authenticated_paper_readiness_endpoint_is_unverified
  web-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web/frontend ci
      - run: npm --prefix web/frontend run test -- src/paperControlDisplay.test.ts
      - run: npm --prefix web/frontend run build
