name: Wealthy Stage1 validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python
        run: python -m pip install -e '.[web]' pytest
      - name: Compile Python sources
        run: python -m compileall -q wealthy_server tests
      - name: Stage 1 regression
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_stage1_bootstrap.py tests/test_stage1_paper.py tests/test_stage1_portfolios.py tests/test_stage1_discovery.py tests/test_stage1_analytics.py tests/test_stage1_decisions.py tests/test_stage1_controls_cards.py tests/test_stage1_backup.py tests/test_stage1_inbox.py tests/test_stage1_stock_sleeves.py tests/test_stage1_hub_catalog.py tests/test_stage1_history30.py tests/test_stage1_autorun.py tests/test_stage1_valuation.py tests/test_stage1_domestic.py tests/test_stage1_risk.py tests/test_stage1_diary.py tests/test_stage1_funding_policy.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install frontend
        run: npm --prefix web/frontend ci
      - name: Build frontend
        run: npm --prefix web/frontend run build
